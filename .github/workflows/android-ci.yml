name: Android CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - feature/*

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery-device:
    name: Discovery device (API ${{ matrix.api }}, synthetic offline)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r docs/data/vocabulary-contract-v1/requirements-validation.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build isolated synthetic Discovery APKs
        run: ./gradlew -PdiscoveryUi=true assembleDiscovery assembleDiscoveryAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run independent cases, suite twice and failure artifact probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python tools/validation/run_ui02_device.py --serial emulator-5554 --output build/ui02-ci
      - name: Retain synthetic failure evidence and device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-api-${{ matrix.api }}-${{ github.sha }}
          # Only synthetic fixture runs; never add internal QA corpus/APKs here.
          path: |
            build/ui02-ci/
            app/build/ui02-fixture/ui02-fixture.json
          if-no-files-found: warn
          retention-days: 14
  quiz-device:
    name: Quiz device (API 28, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python for isolated accepted-corpus fixture
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install vocabulary validation dependencies
        run: python -m pip install -r docs/data/vocabulary-contract-v1/requirements-validation.txt
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run offline Quiz and DATA-08 reboot on a disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/catalog/validate_quiz03_device.sh && bash tools/catalog/validate_data08_reboot.sh
      - name: Upload Quiz device verification summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-device-${{ github.sha }}
          # The isolated app/test APKs and screenshots can contain internal catalog content.
          path: |
            app/build/quiz03-device-evidence/tested-checkout.txt
            app/build/quiz03-device-evidence/exit-status.txt
            app/build/quiz03-device-evidence/offline-check.txt
            app/build/quiz03-device-evidence/apk-sha256.txt
            app/build/quiz03-device-assets/database/quiz03-fixture-metadata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload DATA-08 reboot verification summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data08-reboot-${{ github.sha }}
          path: app/build/data08-reboot-evidence/
          if-no-files-found: ignore
          retention-days: 14

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for vocabulary source checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install vocabulary validation dependencies
        run: python -m pip install -r docs/data/vocabulary-contract-v1/requirements-validation.txt

      - name: Validate vocabulary source registry and gate
        run: |
          python tools/vocabulary/gate_sources.py --snapshot docs/data/snapshot.json --json
          python -m unittest discover -s tools/vocabulary -p 'test_*.py' -v

      - name: Validate local credit consistency
        # Companion consistency does not replace ledger/PO approval.
        run: python tools/catalog/check_credits.py

      - name: Test catalog builder and credit consistency validator
        run: python -m unittest discover -s tools/catalog -p 'test_*.py' -v

      - name: Verify historical provenance and the app release hold
        run: |
          python docs/licensing/voc-data-06/validate_rights.py --verify-audit
          set +e
          python docs/licensing/voc-data-06/validate_rights.py --verify-app-release > build-rights-gate.log 2>&1
          gate_status=$?
          set -e
          test "$gate_status" -eq 1
          grep -q 'APP_RELEASE_BLOCKED' build-rights-gate.log
          rm build-rights-gate.log

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate vocabulary contract and canonical catalog
        run: |
          python -m unittest discover -s docs/data/vocabulary-contract-v1 -p 'test_contract.py' -v
          python docs/data/vocabulary-contract-v1/validate_contract.py docs/data/vocabulary-contract-v1/fixtures/valid/catalog.json

      - name: Validate optional VOC-DATA-05 enrichment
        run: |
          mkdir -p build
          python tools/vocabulary/validate_enrichment.py \
            --input docs/data/voc-data-05/enrichment-v1.json \
            --canonical docs/data/voc-data-04/accepted-v1/canonical-preview.json \
            --taxonomy docs/data/voc-data-05/topic-taxonomy-v1.json \
            --sources docs/data/voc-data-05/label-sources.json \
            --reviews docs/data/voc-data-05/review-decisions.json > build/voc-data-05-coverage.tmp
          mv build/voc-data-05-coverage.tmp build/voc-data-05-coverage.json

      - name: Verify ingestion reproducibility and fixture release rejection
        run: |
          python tools/vocabulary/verify_ingestion.py --fixture --config tools/vocabulary/fixtures/ingestion/verified/config.json --output build/vocabulary-ingestion/ci-proof
          python docs/data/vocabulary-contract-v1/validate_contract.py build/vocabulary-ingestion/ci-proof/a/canonical-catalog.json
          set +e
          python docs/data/vocabulary-contract-v1/validate_contract.py build/vocabulary-ingestion/ci-proof/a/canonical-catalog.json --release
          release_status=$?
          set -e
          test "$release_status" -eq 1

      - name: Verify vocabulary QC and refusal to publish unreviewed content
        run: |
          python tools/vocabulary/quality.py --fixture --input build/vocabulary-ingestion/ci-proof/a --config tools/vocabulary/fixtures/ingestion/verified/config.json --reviews tools/vocabulary/fixtures/quality/reviews.json --output build/vocabulary-quality/ci-a
          python tools/vocabulary/quality.py --fixture --input build/vocabulary-ingestion/ci-proof/a --config tools/vocabulary/fixtures/ingestion/verified/config.json --reviews tools/vocabulary/fixtures/quality/reviews.json --output build/vocabulary-quality/ci-b
          diff -r build/vocabulary-quality/ci-a build/vocabulary-quality/ci-b
          python docs/data/vocabulary-contract-v1/validate_contract.py build/vocabulary-quality/ci-a/canonical-catalog.json
          set +e
          python tools/vocabulary/quality.py --fixture --input build/vocabulary-ingestion/ci-proof/a --config tools/vocabulary/fixtures/ingestion/verified/config.json --reviews tools/vocabulary/fixtures/quality/pending-reviews.json --output build/vocabulary-quality/ci-rejected
          qc_status=$?
          set -e
          test "$qc_status" -eq 1
          test ! -e build/vocabulary-quality/ci-rejected/manifest.json
          test ! -e build/vocabulary-quality/ci-rejected/canonical-catalog.json
          test ! -e build/vocabulary-quality/ci-rejected/validated_vocab.jsonl

      - name: Verify editorial corpus reproducibility and approval blockers
        run: |
          set +e
          python tools/vocabulary/prepare_corpus.py --require-approved --output build/vocabulary-corpus/ci-a
          corpus_a_status=$?
          python tools/vocabulary/prepare_corpus.py --require-approved --output build/vocabulary-corpus/ci-b
          corpus_b_status=$?
          set -e
          test "$corpus_a_status" -eq 1
          test "$corpus_b_status" -eq 1
          diff -r build/vocabulary-corpus/ci-a build/vocabulary-corpus/ci-b
          diff -r docs/data/voc-data-04/corpus-v1 build/vocabulary-corpus/ci-a
          test ! -e build/vocabulary-corpus/ci-a/manifest.json
          test ! -e build/vocabulary-corpus/ci-a/validated_vocab.jsonl
          set +e
          python tools/vocabulary/ingest.py --config docs/data/voc-data-04/corpus-v1/ingestion-proposal.json --output build/vocabulary-ingestion/editorial-approval-check
          editorial_status=$?
          set -e
          test "$editorial_status" -eq 1
          test ! -e build/vocabulary-ingestion/editorial-approval-check/manifest.json

      - name: Verify owner-accepted editorial production handoff
        run: |
          python tools/vocabulary/accept_editorial.py --output build/vocabulary-corpus/accepted-ci
          diff -r docs/data/voc-data-04/accepted-v1 build/vocabulary-corpus/accepted-ci
          python tools/vocabulary/ingest.py --config docs/data/voc-data-04/accepted-v1/ingestion-config.json --output build/vocabulary-ingestion/accepted-ci
          python tools/vocabulary/quality.py --input build/vocabulary-ingestion/accepted-ci --config docs/data/voc-data-04/accepted-v1/ingestion-config.json --reviews docs/data/voc-data-04/accepted-v1/reviews.json --output build/vocabulary-quality/ci-accepted
          python docs/data/vocabulary-contract-v1/validate_contract.py build/vocabulary-quality/ci-accepted/canonical-catalog.json --release
          python tools/vocabulary/accept_editorial.py --verify build/vocabulary-quality/ci-accepted

      - name: Verify pinned Quiz Unicode tables
        run: |
          python tools/unicode/generate.py
          git diff --exit-code -- app/src/main/java/com/vocamind/app/domain/quiz/UnicodeCaseFold.java app/src/main/java/com/vocamind/app/domain/quiz/UnicodeNfcData.java tools/unicode/SHA256SUMS

      - name: Build and verify reproducible accepted catalog candidates
        run: |
          python tools/catalog/build_release.py --qc-dir build/vocabulary-quality/ci-accepted --output-dir build/catalog-release/ci-a
          python tools/catalog/build_release.py --qc-dir build/vocabulary-quality/ci-accepted --output-dir build/catalog-release/ci-b
          diff -r build/catalog-release/ci-a build/catalog-release/ci-b
          python tools/catalog/build_release.py --qc-dir build/vocabulary-quality/ci-accepted --verify-dir build/catalog-release/ci-a
          git diff --exit-code -- app/src/main/assets/database app/schemas

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Test DATA-09 evidence collectors
        run: python -m unittest discover -s tools/validation -p 'test_data09*.py' -v

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Assemble instrumentation test APK
        run: ./gradlew assembleDebugAndroidTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Verify APK asset profiles
        run: |
          python tools/catalog/package_qa.py --verify-apk app/build/outputs/apk/debug/app-debug.apk --fixture
          ./gradlew -PcatalogQa=true assembleCatalogQa assembleCatalogQaAndroidTest
          python tools/catalog/package_qa.py --verify-apk app/build/outputs/apk/catalogQa/app-catalogQa.apk > build/voc06-qa-apk-report.json

      - name: Measure unsigned release build with bundled fixture
        run: |
          ./gradlew assembleRelease
          python tools/validation/data09_apk_size.py --apk app/build/outputs/apk/release/app-release-unsigned.apk --variant release --asset-profile fixture --output build/data09-release-fixture-size.json

      - name: Validate DATA-09 release-based internal QA profile
        run: |
          ./gradlew -Pdata09Profile=true -Pdata09Qa=true assembleData09 assembleData09AndroidTest lintData09
          python tools/validation/data09_apk_size.py --apk app/build/outputs/apk/data09/app-data09.apk --variant data09 --asset-profile internal-qa --output build/data09-apk-size.json
          python tools/validation/data09_performance.py summary --apk-size build/data09-apk-size.json --output build/data09-summary.json

      - name: Upload test reports, fixture APK and verification summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/app-debug.apk
            build/voc06-qa-apk-report.json
            build/data09-apk-size.json
            build/data09-release-fixture-size.json
            build/data09-summary.json
            build/voc-data-05-coverage.json
            build/vocabulary-ingestion/ci-proof/
          if-no-files-found: warn
          retention-days: 14
