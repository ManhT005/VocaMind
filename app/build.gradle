plugins {
    id 'com.android.application'
}

// Resolve SDK jars through Gradle's cache before JUnit starts. Robolectric's
// runtime Maven fetcher otherwise downloads them outside Gradle/CI caching.
// Keep one configuration per SDK so version conflict resolution cannot replace
// the API 26 jar with the API 35 jar (they share the same Maven artifact ID).
def robolectricSdkConfigurations = [
        '8.0.0_r4-robolectric-r1-i7',
        '15-robolectric-13954326-i7'
].withIndex().collect { version, index ->
    def sdk = configurations.create("robolectricSdk${index}") {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    dependencies.add(sdk.name, "org.robolectric:android-all-instrumented:$version")
    sdk
}

def robolectricSdkDirectory = layout.buildDirectory.dir("robolectric-sdks")
def prepareRobolectricSdks = tasks.register('prepareRobolectricSdks', Sync) {
    from robolectricSdkConfigurations
    into robolectricSdkDirectory
}

// Candidate content is visible only to the test classpath/test APK. Main APK
// assets keep their current snapshot until the separate release gates pass.
def releaseTestAssets = layout.buildDirectory.dir('generated/catalog-release-test-assets')
def prepareReleaseCatalogTests = tasks.register('prepareReleaseCatalogTests', Exec) {
    workingDir rootProject.projectDir
    commandLine providers.gradleProperty('catalogPython').orElse(providers.gradleProperty('quiz03PythonExecutable')).getOrElse('python'),
            rootProject.file('tools/catalog/prepare_release_tests.py').absolutePath,
            '--output-dir', releaseTestAssets.get().asFile.absolutePath

    inputs.files(rootProject.fileTree('tools/catalog') { include '*.py' })
    inputs.files(rootProject.fileTree('tools/vocabulary') { include '*.py' })
    inputs.files(rootProject.fileTree('docs/data/voc-data-04'))
    inputs.files(rootProject.fileTree('docs/data/vocabulary-contract-v1') {
        include '*.py', '*.json'
    })
    inputs.file('schemas/com.vocamind.app.data.catalog.CatalogDatabase/2.json')
    outputs.dir(releaseTestAssets)
}

// Opt-in QA application ID keeps the internal corpus and its installed DB separate.
def catalogQaEnabled = providers.gradleProperty('catalogQa').map { it == 'true' }.getOrElse(false)
def discoveryUiEnabled = providers.gradleProperty('discoveryUi').orNull == 'true'
if (discoveryUiEnabled && catalogQaEnabled) throw new GradleException('Choose discoveryUi or catalogQa')
def data09ProfileEnabled = providers.gradleProperty('data09Profile').orNull == 'true'
def data09QaEnabled = providers.gradleProperty('data09Qa').orNull == 'true'
if (data09QaEnabled && !data09ProfileEnabled) throw new GradleException('data09Qa requires data09Profile')
def quiz03DeviceIsolation = providers.gradleProperty('quiz03DeviceIsolation').orNull == 'true'
def progress02DeviceIsolation = providers.gradleProperty('progress02DeviceIsolation').orNull == 'true'
def data08DeviceGeneration = providers.gradleProperty('data08DeviceGeneration').orNull
if (data08DeviceGeneration != null && (!(data08DeviceGeneration in ['A', 'B'])
        || catalogQaEnabled || quiz03DeviceIsolation || progress02DeviceIsolation)) {
    throw new GradleException('DATA-08 device validation requires generation A or B in an isolated debug build')
}
def catalogQaDirectory = layout.buildDirectory.dir('generated/voc06-qa')
def prepareCatalogQa = tasks.register('prepareCatalogQa', Exec) {
    workingDir rootProject.projectDir
    commandLine providers.gradleProperty('catalogPython').getOrElse('python'),
            rootProject.file('tools/catalog/package_qa.py').absolutePath, '--prepare'
    // Re-verify the snapshot and bundle even when a generated output already exists.
    outputs.dir catalogQaDirectory
    // Gradle precreates declared output directories. The atomic QA publisher accepts
    // only an absent target or an identical bundle; remove only that empty shell.
    doFirst {
        def generated = catalogQaDirectory.get().asFile
        if (generated.isDirectory() && generated.listFiles().length == 0) generated.delete()
    }
    outputs.upToDateWhen { false }
}

android {
    namespace 'com.vocamind.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.vocamind.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    if (catalogQaEnabled) {
        buildTypes {
            catalogQa {
                initWith debug
                applicationIdSuffix providers.gradleProperty('discoveryQa').orNull == 'true' ? '.ui02validation.qa' : '.qa'
                resValue 'string', 'app_name', 'VocaMind QA'
            }
        }
        testBuildType 'catalogQa'
    }

    if (discoveryUiEnabled) {
        buildTypes {
            discovery {
                initWith debug
                applicationIdSuffix '.ui02validation'
                matchingFallbacks = ['debug']
            }
        }
        testBuildType 'discovery'
        def fixture = layout.buildDirectory.dir('ui02-fixture')
        def prepareDiscoveryFixture = tasks.register('prepareDiscoveryFixture', Exec) {
            commandLine providers.gradleProperty('catalogPython').getOrElse('python'),
                    rootProject.file('tools/validation/prepare_ui02_fixture.py'),
                    rootProject.file('app/src/main/assets/database'), fixture.get().asFile
            inputs.dir rootProject.file('app/src/main/assets/database')
            inputs.file rootProject.file('tools/validation/prepare_ui02_fixture.py')
            outputs.dir fixture
        }
        sourceSets.discovery.assets.srcDir project.files(fixture).builtBy(prepareDiscoveryFixture)
        tasks.matching { it.name == 'mergeDiscoveryAssets'
                || it.name.toLowerCase(Locale.ROOT).contains('lint') }.configureEach { dependsOn prepareDiscoveryFixture }
    }

    // Opt-in DATA-09 install: release settings, test signing, separate app storage.
    // This diagnostic artifact is never an authorization to publish the catalog.
    if (data09ProfileEnabled) {
        if (catalogQaEnabled) throw new GradleException('Choose data09Profile or catalogQa, not both')
        buildTypes {
            data09 {
                initWith release
                applicationIdSuffix '.data09validation'
                signingConfig signingConfigs.debug
                matchingFallbacks = ['release']
            }
        }
        testBuildType 'data09'
    }

    sourceSets {
        if (data09ProfileEnabled && data09QaEnabled) {
            data09.assets.srcDir project.files(catalogQaDirectory.map { it.dir('assets') }).builtBy(prepareCatalogQa)
        }
        if (catalogQaEnabled) {
            catalogQa.assets.srcDir catalogQaDirectory.map { it.dir('assets') }
        }
        test.java.srcDir "src/catalogTest/java"
        test.resources.srcDir "src/catalogTest/assets"
        test.resources.srcDir "schemas"
        test.resources.srcDir releaseTestAssets
        debug.assets.srcDir rootProject.file('docs/data/vocabulary-contract-v1/fixtures/valid')
        androidTest.java.srcDir "src/catalogTest/java"
        androidTest.assets.srcDir "src/catalogTest/assets"
        androidTest.assets.srcDir releaseTestAssets
        test.java.srcDir "src/attributionTest/java"
        androidTest.java.srcDir "src/attributionTest/java"
        test.java.srcDir "src/searchTest/java"
        androidTest.java.srcDir "src/searchTest/java"
        test.java.srcDir "src/quizTest/java"
        androidTest.java.srcDir "src/quizTest/java"
        androidTest.assets.srcDir "schemas"
    }

    // Opt-in device validation uses separate app storage; never replace a real user's install.
    buildTypes {
        debug {
            if (data08DeviceGeneration != null) {
                applicationIdSuffix '.data08validation'
            } else if (quiz03DeviceIsolation || progress02DeviceIsolation) {
                applicationIdSuffix progress02DeviceIsolation ? '.progress02validation' : '.quiz03validation'
            }
        }
    }
    if (quiz03DeviceIsolation || progress02DeviceIsolation) {
        def quizAssets = layout.buildDirectory.dir('quiz03-device-assets')
        def quizBuilder = rootProject.file('tools/catalog/build_quiz03_device_fixture.py')
        sourceSets.debug.assets.srcDir quizAssets
        def prepareQuiz03DeviceAssets = tasks.register('prepareQuiz03DeviceAssets', Exec) {
            dependsOn prepareReleaseCatalogTests
            commandLine providers.gradleProperty('quiz03PythonExecutable').getOrElse('python'),
                    quizBuilder.absolutePath, releaseTestAssets.get().dir('release-candidate').asFile,
                    quizAssets.get().dir('database').asFile
            inputs.file quizBuilder
            inputs.dir releaseTestAssets
            outputs.dir quizAssets
        }
        tasks.matching { it.name == 'mergeDebugAssets' }.configureEach {
            dependsOn prepareQuiz03DeviceAssets
        }
    }
    if (data08DeviceGeneration == 'B') {
        def deviceAssets = layout.buildDirectory.dir('data08-device-assets')
        def fixture = file('src/main/assets/database')
        def generator = rootProject.file('tools/catalog/build_data08_device_fixture.py')
        sourceSets.debug.assets.srcDir deviceAssets
        def prepareData08DeviceAssets = tasks.register('prepareData08DeviceAssets', Exec) {
            commandLine providers.gradleProperty('catalogPython').getOrElse('python'),
                    generator.absolutePath, fixture, deviceAssets.get().dir('database').asFile
            inputs.file generator
            inputs.dir fixture
            outputs.dir deviceAssets
        }
        tasks.matching { it.name == 'mergeDebugAssets' }.configureEach {
            dependsOn prepareData08DeviceAssets
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            dependsOn prepareRobolectricSdks
            inputs.files(robolectricSdkConfigurations)
            // Robolectric's native loader treats URL-encoded spaces as literal paths.
            // Use the OS temp directory when the checkout path contains spaces.
            def testHome = projectDir.absolutePath.contains(' ')
                    ? new File(System.getProperty('java.io.tmpdir'), 'vocamind-robolectric-home')
                    : layout.buildDirectory.dir("robolectric-home").get().asFile
            testHome.mkdirs()
            systemProperty "user.home", testHome.absolutePath
            systemProperty "robolectric.offline", "true"
            systemProperty "robolectric.dependency.dir", robolectricSdkDirectory.get().asFile.absolutePath
            testLogging {
                events "failed", "skipped"
                exceptionFormat "full"
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.configureEach {
    if ((catalogQaEnabled && name == 'mergeCatalogQaAssets')
            || (data09QaEnabled && name == 'mergeData09Assets')
            || ((catalogQaEnabled || data09QaEnabled) && name.toLowerCase(Locale.ROOT).contains('lint'))) {
        dependsOn prepareCatalogQa
    }
    if (name.endsWith('UnitTestJavaRes') || name.endsWith('AndroidTestAssets')
            || name.toLowerCase(Locale.ROOT).contains('lint')) {
        dependsOn prepareReleaseCatalogTests
    }
}

dependencies {
    def lifecycle_version = "2.11.0"
    def nav_version = "2.10.2"
    def room_version = "2.8.5"

    implementation 'com.google.android.material:material:1.13.0'

    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"

    implementation "androidx.navigation:navigation-fragment:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"

    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
